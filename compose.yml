name: ${COMPOSE_PROJECT_NAME:-my-llm-bot}

services:
  app:
    image: ${APP_IMAGE:-my-llm-bot:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import bot.main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
